<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ATI-SOSYAL Moderasyon Paneli</title>
    <script>
      // Apply the saved theme before the first paint (src/composables/useTheme.ts).
      try {
        if (localStorage.getItem('nsosyal.theme') === 'light') document.documentElement.classList.add('light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
