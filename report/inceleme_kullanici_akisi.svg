<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1470" width="1280" height="1470" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7885"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1470" fill="#ffffff"/>

  <text x="40" y="50" font-size="24" font-weight="600" fill="#1c2530">İnceleme kullanıcı akışı</text>
  <text x="40" y="76" font-size="13" fill="#5c6b7a">ATİ-SOSYAL inceleme istasyonu. Tasarlanan tam akış, her adımda bugünkü kod durumu ile işaretlenmiştir.</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="700" y="106" width="560" height="196" rx="6" fill="#f7f8f9" stroke="#d5dbe0"/>
  <text x="722" y="132" font-size="14" font-weight="600" fill="#1c2530">Gösterim</text>

  <rect x="722" y="146" width="34" height="24" rx="4" fill="#dce7ee" stroke="#2f5d7c" stroke-width="1.6"/>
  <text x="768" y="157" font-size="12.5" font-weight="600" fill="#1c2530">[YAPILDI]</text>
  <text x="768" y="173" font-size="12" fill="#5c6b7a">Kodda mevcut ve doğrulanmış</text>

  <rect x="722" y="192" width="34" height="24" rx="4" fill="#f2e9d8" stroke="#8a6a2f" stroke-width="1.6"/>
  <text x="768" y="203" font-size="12.5" font-weight="600" fill="#1c2530">[KISMEN YAPILDI]</text>
  <text x="768" y="219" font-size="12" fill="#5c6b7a">Adımın bir bölümü kodda, tamamı değil</text>

  <rect x="722" y="238" width="34" height="24" rx="4" fill="#ffffff" stroke="#94a0ac" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="768" y="249" font-size="12.5" font-weight="600" fill="#1c2530">[TASARLANDI]</text>
  <text x="768" y="265" font-size="12" fill="#5c6b7a">Kodda yok. Üretim mimarisi tasarımı (bölüm 4.3)</text>

  <text x="722" y="290" font-size="11.5" font-style="italic" fill="#8a6a2f">Kesikli çerçeveli her kutu bugün depoda çalışmıyor.</text>

  <!-- ===================== BUILT CORE PANEL ===================== -->
  <rect x="700" y="326" width="560" height="252" rx="6" fill="#f2f6f8" stroke="#2f5d7c"/>
  <text x="722" y="352" font-size="14" font-weight="600" fill="#1c2530">Bugün demo/app.py içinde gerçekten çalışan çekirdek</text>
  <text x="722" y="376" font-size="12.5" fill="#1c2530">885 MB BERTurk kontrol noktası yerelden yüklenir, ağ yok</text>
  <text x="722" y="392" font-size="11.5" fill="#5c6b7a">app.py:359-392, load_assets</text>
  <text x="722" y="416" font-size="12.5" fill="#1c2530">CPU üzerinde gerçek çıkarım, P(OFF) hesaplanır</text>
  <text x="722" y="432" font-size="11.5" fill="#5c6b7a">app.py:110-120, model_decision</text>
  <text x="722" y="456" font-size="12.5" fill="#1c2530">Maliyet türevli güven eşiği ve yönlendirme kararı</text>
  <text x="722" y="472" font-size="11.5" fill="#5c6b7a">app.py:140-152, conf = max(p, 1-p); auto = conf &gt;= threshold</text>
  <text x="722" y="496" font-size="12.5" fill="#1c2530">Erteleme halinde ham modelin etiketi ve skoru sayfaya ulaşmaz</text>
  <text x="722" y="512" font-size="11.5" fill="#5c6b7a">app.py:150 ve app.py:234-240, HTTP çıktısında doğrulandı</text>
  <line x1="722" y1="530" x2="1238" y2="530" stroke="#c9d3da"/>
  <text x="722" y="550" font-size="12" font-style="italic" fill="#2f5d7c">Bu çekirdek, akışın bir adımı değildir. Akışın altındaki motordur;</text>
  <text x="722" y="566" font-size="12" font-style="italic" fill="#2f5d7c">bölüm 3.3 bu motora dayanır.</text>

  <!-- ===================== A4 CALLOUT ===================== -->
  <rect x="700" y="606" width="560" height="336" rx="6" fill="#faf6ed" stroke="#8a6a2f"/>
  <text x="722" y="632" font-size="14" font-weight="600" fill="#1c2530">Neden KISMEN YAPILDI: gizleme adımının sınırı</text>
  <text x="722" y="656" font-size="12.5" fill="#1c2530">Gerçekten yapılan: erteleme durumunda ham modelin karar,</text>
  <text x="722" y="672" font-size="12.5" fill="#1c2530">olasılık ve ayrıntı hücreleri sayfadan tamamen çıkarılır.</text>
  <text x="722" y="688" font-size="11.5" fill="#5c6b7a">app.py:234, if key == "raw" and not sel["auto"]</text>
  <line x1="722" y1="704" x2="1238" y2="704" stroke="#e0d6c0"/>
  <text x="722" y="726" font-size="12.5" font-weight="600" fill="#8a6a2f">Bugün hâlâ eksik olan üç nokta:</text>
  <text x="722" y="748" font-size="12.5" fill="#1c2530">1. Gizleme yalnızca ham modele uygulanır. İkinci modelin</text>
  <text x="722" y="764" font-size="12.5" fill="#1c2530">    etiketi ve P(OFF) değeri ertelenen olayda da görünür.</text>
  <text x="722" y="780" font-size="11.5" fill="#5c6b7a">    app.py:229-234, döngü yalnızca "raw" anahtarında kapanır</text>
  <text x="722" y="802" font-size="12.5" fill="#1c2530">2. Anahtar kelime satırı, eşleşen sözlük kökünü göstermeye</text>
  <text x="722" y="818" font-size="12.5" fill="#1c2530">    devam eder. Sözlük dilimi gizlenmiyor.</text>
  <text x="722" y="834" font-size="11.5" fill="#5c6b7a">    app.py:132-134, "lexicon roots matched"</text>
  <text x="722" y="856" font-size="12.5" fill="#1c2530">3. max(p, 1-p) güven değeri ertelenen olayda da yazdırılır.</text>
  <text x="722" y="872" font-size="12.5" fill="#1c2530">    Yön bilgisi vermez, ancak büyüklük görünürdür.</text>
  <text x="722" y="888" font-size="11.5" fill="#5c6b7a">    app.py:262</text>
  <line x1="722" y1="904" x2="1238" y2="904" stroke="#e0d6c0"/>
  <text x="722" y="924" font-size="12" font-style="italic" fill="#8a6a2f">Bugünkü ekran bir inceleme ekranı değil, üç sistemi yan yana</text>
  <text x="722" y="938" font-size="12" font-style="italic" fill="#8a6a2f">gösteren tek kutulu operatör ekranıdır.</text>

